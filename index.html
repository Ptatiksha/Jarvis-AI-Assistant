<script>
const SYS="Tumhara naam Jarvis hai. Tum ek smart, calm, friendly aur natural AI voice assistant ho. Robotic ya template jaisa mat bolo; context ke hisab se natural conversational phrasing use karo. Har reply ko greeting se start mat karo aur user ki baat ko unnecessarily repeat mat karo. Agar simple acknowledgement enough ho to seedha short acknowledgement do. User confused ho to simple step-by-step explain karo. User se natural human assistant ki tarah baat karo. Reply user ki language ke according karo. English question ka English mein answer do. Hindi question ka Hindi mein answer do. Hinglish question ka natural Hinglish mein answer do. Marathi question ka Marathi mein answer do. Normal answers short, clear and conversational rakho. Usually 2 se 4 sentences mein answer do. Study ya programming question mein zarurat ho to properly explain karo. Calculations ka exact answer do. Response voice mein bola jayega, isliye natural spoken sentences use karo. Unnecessary markdown, stars, hashes aur headings mat use karo. Agar user follow-up question pooche to recent conversation context ka use karo. Agar context insufficient ho to guess karne ke bajay clarification maango. Sensitive actions kabhi user confirmation ke bina execute karne ko mat kaho. MOOD-AWARE CONVERSATION: User ke words aur context se unka possible mood samjho, lekin certainty ka claim mat karo. Agar user gusse mein lage, calmly acknowledge karo, argue ya lecture mat karo, aur poochho kya hua ya kis tarah help karun. Agar user sad, lonely, disappointed ya upset lage, pehle empathy dikhao, unki feeling ko dismiss mat karo, aur gently poochho woh share karna chahte hain ya distraction chahte hain. Agar user happy ya excited ho, unki energy ko naturally match karo aur poochho kya achha hua; overdo mat karo. Agar user bimar ya pain mein hone ki baat kare, caring response do, simple safe suggestion do, diagnosis ya medicine prescribe mat karo; severe/unusual symptoms mein trusted adult/medical professional ko batane ko kaho. Agar user tired/stressed/confused ho, short supportive reply aur ek manageable next step do. Agar mood clear na ho, assume mat karo; normal friendly response do. Agar user apne mood ke saath koi task bhi bole, dono ka dhyan rakho: pehle brief caring acknowledgement, phir task ko handle karo. Mood ko user ke against use mat karo, unki feeling ka mazaak mat banao, aur baar-baar mood label mat karo.";

 d.firstChild.append(i);d.lastChild.textContent=t;$("#chat").append(d);$("#chat").scrollTop=1e9}

/* ---------- VOICE: same voices (Edge TTS names) + rate +12% ---------- */
let voices=[];const lv=()=>voices=speechSynthesis.getVoices();lv();speechSynthesis.onvoiceschanged=lv;
const pick=h=>voices.find(v=>v.name.includes(h?"Madhur":"Prabhat"))||voices.find(v=>v.lang.replace("_","-")==(h?"hi-IN":"en-IN"));

const speak=t=>chain=chain.then(()=>talk(t)).catch(()=>{});
function talk(raw){
 let t=String(raw??"").trim();if(!t)return;
 t=t.replace(/[*#`]/g,"").replace(/_/g," ").replace(/\+/g," plus ").replace(/=/g," equals ").replace(/×/g," multiplied by ").replace(/÷/g," divided by ").replace(/%/g," percent ");
 log("JARVIS",t);status("SPEAKING",t.slice(0,90));
 const hi=/[\u0900-\u097F]/.test(t),v=pick(hi),parts=t.match(/[^.!?।\n]+[.!?।]*\s*/g)||[t];
 return parts.reduce((p,s)=>p.then(()=>new Promise(r=>{
  const u=new SpeechSynthesisUtterance(s);if(v)u.voice=v;u.lang=v?v.lang:(hi?"hi-IN":"en-IN");u.rate=1.12;
  const z=setTimeout(r,s.length*130+4000);u.onend=u.onerror=()=>{clearTimeout(z);r()};speechSynthesis.speak(u)})),Promise.resolve()).then(()=>sleep(300));
}
const bg=t=>listening?bgq.push(t):speak(t);
 
/* ---------- LISTEN: Google speech recognition, en-IN (same as py) ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function listen(ms,lim){return new Promise(res=>{
 if(q.length)return res({t:q.shift(),k:1});

 const fin=(t,k)=>{if(done)return;done=1;clearTimeout(z);waiter=null;listening=false;try{rec&&rec.abort()}catch{}res({t:t||"",k})};

 rec.onerror=e=>{if(/not-allowed|service/.test(e.error)&&!denied){denied=1;log("SYSTEM","Mic permission nahi mili. Address bar me mic allow karo, ya neeche type karke use karo.")}
  else if(!/no-speech|aborted|not-allowed|service/.test(e.error)){const E=listen.e||(listen.e={});if(!E[e.error]){E[e.error]=1;log("SYSTEM","Voice recognition error: "+e.error+". Chrome ya Edge (normal window) me kholo, Brave/in-app browser me mic kaam nahi karta. Neeche type bhi kar sakte ho.")}}fin("")};

 z=setTimeout(()=>fin(""),ms+lim);listening=true;try{rec.start()}catch{fin("")}})}

async function ai(question){
 if(!KEY)return "Groq API key set nahi hai. Upar API key button se key daalo.";
 try{msgs.push({role:"user",content:question});
  const r=await fetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+KEY},
   body:JSON.stringify({model:"openai/gpt-oss-120b",messages:msgs,temperature:.45,max_tokens:240,reasoning_effort:"low"})});
  const j=await r.json();if(j.error)return "Groq error: "+String(j.error.message||"").slice(0,140);const rep=(j.choices?.[0]?.message?.content||"").trim();
  if(!rep)return "Mujhe iska answer nahi mila.";

  if(msgs.length>17)msgs=[msgs[0],...msgs.slice(-14)];
  return rep}catch(e){return "AI se connect karne mein problem aa rahi hai."}}

 sick:["bimar","beemar","tabiyat kharab","sar dukh","sir dukh","headache","bukhar","fever","pain ho","dard ho","nausea","ulti"],
 tired:["thak gayi","thak gaya","tired","exhausted","stress","stressed","tension","overwhelmed"],
 conf:["confused","samajh nahi aa","kya karun","pata nahi kya karun","pareshan"]},
 R={anger:"Lagta hai kuch tumhe bahut irritate kar raha hai. Main calmly sun sakta hoon—kya hua, ya abhi tumhe kis tarah ki help chahiye?",
 sad:"Mujhe afsos hai ki tum aisa feel kar rahi ho. Agar tum chaho toh bata sakti ho kya hua; ya hum kisi light topic ya music se thoda mind divert kar sakte hain.",
 happy:"Arey wah, ye sunkar achha laga! Kya special hua? Batao, main sun raha hoon.",
 sick:"Oh, apna dhyan rakho. Kya symptoms ya takleef ho rahi hai? Agar dard bahut tez ya achanak shuru hua hai, ya saath mein vision problem, confusion, fever ya vomiting hai, toh kisi trusted adult ko abhi batao aur medical help lo.",
 tired:"Lagta hai tum kaafi thak ya stress feel kar rahi ho. Agar possible ho toh thoda break aur paani le lo. Chaho toh hum ek chhota sa next step saath mein decide kar sakte hain.",
 conf:"Koi baat nahi, ek-ek step karke dekhte hain. Tum mujhe situation thodi si batao; main options simple karke samjha dunga."};
 for(const k in L)if(L[k].some(x=>t.includes(x)))return R[k]}
 
/* ---------- COMMANDS ---------- */
const clean=t=>t.toLowerCase().trim().replace(/\s+/g," ").replace(/^jarvis[\s,]*/,"").replace(/[\s.,!?।]+$/,"").trim();

 let hosts=[];try{hosts=(await(await fetch("https://piped-instances.kavin.rocks/",{signal:AbortSignal.timeout(5000)})).json()).map(x=>x.api_url).filter(Boolean).slice(0,5)}catch{}
 for(const h of[...new Set([...hosts,"https://pipedapi.kavin.rocks"])]){try{const j=await(await fetch(`${h}/search?q=${encodeURIComponent(q)}&filter=videos`,{signal:AbortSignal.timeout(6000)})).json(),u=(j.items||[]).find(i=>(i.url||"").includes("v="))?.url;if(u)return u.split("v=")[1].split("&")[0]}catch{}}
