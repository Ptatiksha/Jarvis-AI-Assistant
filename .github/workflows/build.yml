name: Build Jarvis exe

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: >
          pyinstaller --onefile --windowed --name Jarvis
          --collect-all customtkinter
          --collect-all edge_tts
          --collect-all speech_recognition
          --collect-all pywhatkit
          --hidden-import jarvis_mood_aware_v15
          jarvis_launcher.py

      - name: Save exe as download
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-exe
          path: dist/Jarvis.exe

      - name: Attach exe to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Jarvis.exe
